<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="186" viewBox="0 0 1360 186" role="img" aria-labelledby="title desc">
  <title id="title">Yamlink core loop</title>
  <desc id="desc">Write, link, query, inspect, refine.</desc>
  <style>
    text { font-family:"Roboto Flex","Roboto","Segoe UI",sans-serif; }
    .step { fill:#E6E8EB; font-size:26px; font-weight:780; }
    .copy { fill:#9EA3AA; font-size:15px; font-weight:500; }
    .num { fill:#151617; font-size:15px; font-weight:850; }
  </style>
  <rect x="0" y="0" width="1360" height="186" rx="24" fill="#151617" stroke="#2B2D31"/>
  <path d="M116 93H1244" stroke="#40454C" stroke-width="2"/>

  <g transform="translate(72 38)">
    <circle cx="55" cy="55" r="28" fill="#C5FFBF"/>
    <text class="num" x="49" y="61">1</text>
    <text class="step" x="102" y="47">Write</text>
    <text class="copy" x="102" y="72">Markdown + frontmatter</text>
  </g>
  <g transform="translate(320 38)">
    <circle cx="55" cy="55" r="28" fill="#5ECFBE"/>
    <text class="num" x="49" y="61">2</text>
    <text class="step" x="102" y="47">Link</text>
    <text class="copy" x="102" y="72">body + fields</text>
  </g>
  <g transform="translate(560 38)">
    <circle cx="55" cy="55" r="28" fill="#C49BF0"/>
    <text class="num" x="49" y="61">3</text>
    <text class="step" x="102" y="47">Query</text>
    <text class="copy" x="102" y="72">live views</text>
  </g>
  <g transform="translate(800 38)">
    <circle cx="55" cy="55" r="28" fill="#E7A85A"/>
    <text class="num" x="49" y="61">4</text>
    <text class="step" x="102" y="47">Inspect</text>
    <text class="copy" x="102" y="72">graph + reports</text>
  </g>
  <g transform="translate(1062 38)">
    <circle cx="55" cy="55" r="28" fill="#E67D61"/>
    <text class="num" x="49" y="61">5</text>
    <text class="step" x="102" y="47">Refine</text>
    <text class="copy" x="102" y="72">better notes over time</text>
  </g>
</svg>
