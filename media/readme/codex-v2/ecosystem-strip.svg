<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="250" viewBox="0 0 1360 250" role="img" aria-labelledby="title desc">
  <title id="title">Yamlink ecosystem</title>
  <desc id="desc">The same Yamlink engine serving VS Code, CLI, API, LSP, Conduit, and publishing.</desc>
  <style>
    text { font-family:"Roboto Flex","Roboto","Segoe UI",sans-serif; }
    .title { fill:#E6E8EB; font-size:30px; font-weight:800; }
    .meta { fill:#9EA3AA; font-size:15px; font-weight:520; }
    .node { fill:#E6E8EB; font-size:19px; font-weight:740; }
  </style>
  <rect width="1360" height="250" rx="24" fill="#151617" stroke="#2B2D31"/>
  <text class="title" x="64" y="64">One engine, several doors in.</text>
  <text class="meta" x="64" y="94">The VS Code extension is the richest client. The same local graph also runs headless.</text>

  <g transform="translate(84 142)">
    <path d="M0 28H1130" stroke="#40454C" stroke-width="2"/>
    <g transform="translate(0 0)">
      <rect width="150" height="58" rx="16" fill="#1A1B1D" stroke="#C5FFBF"/>
      <text class="node" x="42" y="36">VS Code</text>
    </g>
    <g transform="translate(196 0)">
      <rect width="130" height="58" rx="16" fill="#1A1B1D" stroke="#5ECFBE"/>
      <text class="node" x="43" y="36">CLI</text>
    </g>
    <g transform="translate(372 0)">
      <rect width="130" height="58" rx="16" fill="#1A1B1D" stroke="#C49BF0"/>
      <text class="node" x="43" y="36">API</text>
    </g>
    <g transform="translate(548 0)">
      <rect width="130" height="58" rx="16" fill="#1A1B1D" stroke="#E7A85A"/>
      <text class="node" x="43" y="36">LSP</text>
    </g>
    <g transform="translate(724 0)">
      <rect width="168" height="58" rx="16" fill="#1A1B1D" stroke="#E67D61"/>
      <text class="node" x="42" y="36">Conduit</text>
    </g>
    <g transform="translate(938 0)">
      <rect width="190" height="58" rx="16" fill="#1A1B1D" stroke="#666B72"/>
      <text class="node" x="38" y="36">Publishing</text>
    </g>
  </g>
</svg>
